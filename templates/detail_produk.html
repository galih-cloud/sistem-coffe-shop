{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <span class="badge bg-primary fs-6">{{ produk.kategori }}</span>
                    </div>
                    
                    <h2 class="fw-bold mb-3">{{ produk.nama }}</h2>
                    <hr>
                    
                    <p class="fs-4 text-success fw-bold mb-3">Rp{{ "{:,}".format(produk.harga) }}</p>
                    
                    <p class="text-muted mb-4">
                        Status Stok: 
                        {% if produk.stok > 0 %}
                            <strong class="text-success">Tersedia ({{ produk.stok }} item)</strong>
                        {% else %}
                            <strong class="text-danger">Stok Kosong</strong>
                        {% endif %}
                    </p>
                    
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('produk') }}" class="btn btn-dark">&larr; Kembali ke Daftar Menu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
