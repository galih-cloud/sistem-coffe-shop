<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}KuyKopi{% endblock %}</title>
    <!-- CDN Bootstrap 5 biar tampilannya rapi dan modern -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
        <a class="navbar-brand fw-bold" href="{{ url_for('beranda') }}">☕ KuyKopi</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
            <a class="nav-link" href="{{ url_for('produk') }}">menu</a>
            <a class="nav-link" href="{{ url_for('tentang') }}">tentang</a>
            <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
        </div>
    </nav>

    <main class="container-fluid px-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 mt-5 bg-light border-top">
        <small>&copy; 2026 KuyKopi - Sistem Informasi</small>
    </footer>
</body>
</html>
