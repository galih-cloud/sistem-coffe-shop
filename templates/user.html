{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom shadow-lg bg-white p-4 text-center">
                <div class="card-body">
                    <!-- Icon Profil / Avatar -->
                    <div class="display-3 text-coffee mb-3">
                        <i class="fa-solid fa-user-circle"></i>
                    </div>
                    
                    <span class="badge bg-secondary mb-2">Profil Pengguna / Barista</span>
                    <h2 class="fw-bold mb-3">Halo, {{ nama }}!</h2>
                    <p class="text-muted mb-4">
                        Selamat datang di panel akun sistem manajemen KuyKopi. Semua data akses Anda aktif dan terverifikasi.
                    </p>
                    
                    <div class="d-grid gap-2">
                        <a href="{{ url_for('beranda') }}" class="btn btn-coffee rounded-pill py-2">
                            <i class="fa-solid fa-house me-2"></i>Kembali ke Beranda
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
